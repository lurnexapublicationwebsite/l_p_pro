version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
    build:
      commands:
        - rm -rf .next
        - node scripts/inject-env.js
        - NODE_OPTIONS="--max-old-space-size=4096" npm run build
        - rm -rf .next/cache
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
    exclude:
      - 'cache/**/*'
  cache:
    paths:
      - node_modules/**/*



